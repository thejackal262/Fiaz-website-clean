backend:
  name: github
  repo: thejackal262/Fiaz-website-clean
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website Editor"
    files:
      - file: "content/site.json"
        label: "Edit Website"
        name: "site"
        format: "json"
        fields:
          - { label: "Browser Title", name: "seoTitle", widget: "string", required: false }
          - { label: "Google Description", name: "seoDescription", widget: "text", required: false }
          - { label: "Business Name", name: "brandName", widget: "string", required: false }

          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Hero Photo", name: "heroImage", widget: "image", required: false }
          - { label: "About Photo", name: "aboutImage", widget: "image", required: false }

          - { label: "Background Colour", name: "backgroundColor", widget: "color", required: false }
          - { label: "Card Colour", name: "cardColor", widget: "color", required: false }
          - { label: "Main Text Colour", name: "mainTextColor", widget: "color", required: false }
          - { label: "Body Text Colour", name: "bodyTextColor", widget: "color", required: false }
          - { label: "Gold Accent Colour", name: "goldColor", widget: "color", required: false }
          - { label: "Button Text Colour", name: "buttonTextColor", widget: "color", required: false }

          - label: "Navigation Links"
            name: "navLinks"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Link", name: "url", widget: "string", required: false }

          - { label: "Small Badge Text", name: "heroBadge", widget: "string", required: false }
          - { label: "Heading Line 1", name: "heroLine1", widget: "string", required: false }
          - { label: "Heading Line 2 - Gold Text", name: "heroLine2", widget: "string", required: false }
          - { label: "Heading Line 3", name: "heroLine3", widget: "string", required: false }
          - { label: "Hero Paragraph", name: "heroText", widget: "text", required: false }
          - { label: "Main Button Text", name: "primaryButtonText", widget: "string", required: false }
          - { label: "Main Button Link", name: "primaryButtonLink", widget: "string", required: false }
          - { label: "Second Button Text", name: "secondaryButtonText", widget: "string", required: false }
          - { label: "Second Button Link", name: "secondaryButtonLink", widget: "string", required: false }

          - label: "Stats"
            name: "stats"
            widget: "list"
            required: false
            fields:
              - { label: "Number", name: "number", widget: "string", required: false }
              - { label: "Label", name: "label", widget: "string", required: false }

          - { label: "About Small Heading", name: "aboutKicker", widget: "string", required: false }
          - { label: "About Main Heading", name: "aboutTitle", widget: "string", required: false }
          - { label: "About Paragraph", name: "aboutText", widget: "text", required: false }
          - { label: "About Bullet Points", name: "aboutPoints", widget: "list", required: false }

          - { label: "Services Small Heading", name: "servicesKicker", widget: "string", required: false }
          - { label: "Services Main Heading", name: "servicesTitle", widget: "string", required: false }
          - { label: "Services Paragraph", name: "servicesText", widget: "text", required: false }

          - label: "Services"
            name: "services"
            widget: "list"
            required: false
            fields:
              - { label: "Small Text", name: "small", widget: "string", required: false }
              - { label: "Service Heading", name: "title", widget: "string", required: false }
              - { label: "Service Text", name: "text", widget: "text", required: false }

          - { label: "Banner Text", name: "bannerText", widget: "string", required: false }

          - { label: "Results Small Heading", name: "resultsKicker", widget: "string", required: false }
          - { label: "Results Main Heading", name: "resultsTitle", widget: "string", required: false }
          - { label: "Results Paragraph", name: "resultsText", widget: "text", required: false }

          - label: "Results"
            name: "results"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Label", name: "label", widget: "string", required: false }

          - { label: "Pricing Small Heading", name: "pricingKicker", widget: "string", required: false }
          - { label: "Pricing Main Heading", name: "pricingTitle", widget: "string", required: false }
          - { label: "Pricing Paragraph", name: "pricingText", widget: "text", required: false }

          - label: "Packages"
            name: "packages"
            widget: "list"
            required: false
            fields:
              - { label: "Package Name", name: "name", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
              - { label: "Featured Package", name: "featured", widget: "boolean", required: false, default: false }
              - { label: "Button Text", name: "button", widget: "string", required: false }
              - { label: "Bullet Points", name: "items", widget: "list", required: false }

          - { label: "Testimonial Small Heading", name: "testimonialKicker", widget: "string", required: false }
          - { label: "Testimonial Main Heading", name: "testimonialTitle", widget: "string", required: false }
          - { label: "Testimonial Text", name: "testimonialText", widget: "text", required: false }
          - { label: "Testimonial Name", name: "testimonialName", widget: "string", required: false }

          - { label: "FAQ Small Heading", name: "faqKicker", widget: "string", required: false }
          - { label: "FAQ Main Heading", name: "faqTitle", widget: "string", required: false }

          - label: "FAQs"
            name: "faqs"
            widget: "list"
            required: false
            fields:
              - { label: "Question", name: "question", widget: "string", required: false }
              - { label: "Answer", name: "answer", widget: "text", required: false }

          - { label: "Final CTA Small Heading", name: "finalKicker", widget: "string", required: false }
          - { label: "Final CTA Main Heading", name: "finalTitle", widget: "string", required: false }
          - { label: "Final CTA Paragraph", name: "finalText", widget: "text", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Email Button Text", name: "emailButtonText", widget: "string", required: false }
          - { label: "Instagram Link", name: "instagram", widget: "string", required: false }
          - { label: "TikTok Link", name: "tiktok", widget: "string", required: false }
          - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
          - { label: "Footer Text", name: "footerText", widget: "string", required: false }
