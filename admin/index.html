<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Jackal Canvas Builder</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <h1>Jackal Canvas Builder</h1>
    <p>Click anything. Drag it. Resize it. Publish when ready.</p>
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password"/>
    <button id="loginBtn">Login</button>
    <small id="loginMsg"></small>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div class="brandline">
      <strong>Jackal Canvas Builder</strong>
      <span id="status">Ready.</span>
    </div>
    <div class="toolbar">
      <button id="sectionsBtn" class="tool">Sections</button>
      <button id="undoBtn" class="tool">Undo</button>
      <button id="redoBtn" class="tool">Redo</button>
      <button id="desktopBtn" class="tool active">Desktop</button>
      <button id="phoneBtn" class="tool">Phone</button>
      <button id="publishBtn" class="publish">Publish</button>
    </div>
  </div>

  <div id="sectionsPanel" class="sections-panel hidden">
    <h2>Sections</h2>
    <p>Drag to reorder. Hide/show as needed.</p>
    <div id="sectionList"></div>
  </div>

  <div id="stage" class="stage desktop">
    <iframe id="siteFrame" src="/?canvasbuilder=1"></iframe>
  </div>

  <div id="canvasToolbar" class="canvas-toolbar hidden">
    <button id="editTextBtn">Edit text</button>
    <button id="biggerTextBtn">Text +</button>
    <button id="smallerTextBtn">Text -</button>
    <button id="imageUpBtn">Image +</button>
    <button id="imageDownBtn">Image -</button>
    <button id="replaceImageBtn">Replace image</button>
    <button id="duplicateBtn">Duplicate</button>
    <button id="resetSelectedBtn">Reset</button>
    <button id="doneBtn">Done</button>
  </div>

  <div id="hint" class="hint">
    Click any text, image, card or section. Drag images to crop. Drag handles to resize boxes.
  </div>

  <input id="imageUpload" type="file" accept="image/*" hidden>
</div>

<div id="textModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="textModalTitle">Edit text</h2>
    <textarea id="textEditor"></textarea>
    <div class="modal-actions">
      <button id="applyTextBtn">Apply</button>
      <button id="cancelTextBtn" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
