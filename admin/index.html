<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Jackal Builder Live</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <h1>Jackal Builder Live</h1>
    <p>Click the website. Move images. Resize text. Publish when ready.</p>
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password"/>
    <button id="loginBtn">Login</button>
    <small id="loginMsg"></small>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div>
      <strong>Jackal Builder Live</strong>
      <span id="status">Ready.</span>
    </div>
    <div class="toolbar">
      <button id="selectBtn" class="tool active">Select</button>
      <button id="moveSectionsBtn" class="tool">Sections</button>
      <button id="undoBtn" class="tool">Undo</button>
      <button id="redoBtn" class="tool">Redo</button>
      <button id="phoneBtn" class="tool">Phone</button>
      <button id="desktopBtn" class="tool active">Desktop</button>
      <button id="publishBtn" class="publish">Publish</button>
    </div>
  </div>

  <div id="sectionDrawer" class="section-drawer hidden">
    <h2>Move sections</h2>
    <p>Drag these. The page updates live.</p>
    <div id="sectionList"></div>
  </div>

  <div id="stage" class="stage desktop">
    <iframe id="siteFrame" src="/?livebuilder=1"></iframe>
  </div>

  <div id="floatingBar" class="floating-bar hidden">
    <button id="editTextBtn">Edit text</button>
    <button id="textBiggerBtn">Text +</button>
    <button id="textSmallerBtn">Text -</button>
    <button id="imageBiggerBtn">Image +</button>
    <button id="imageSmallerBtn">Image -</button>
    <button id="replaceImageBtn">Replace image</button>
    <button id="resetBtn">Reset</button>
    <button id="doneBtn">Done</button>
  </div>

  <div id="helpBubble" class="help-bubble">
    Click text to edit. Click images/backgrounds to move and resize them live.
  </div>

  <input id="imageUpload" type="file" accept="image/*" hidden>
</div>

<div id="textModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="textModalTitle">Edit text</h2>
    <textarea id="textEditor"></textarea>
    <div class="modal-actions">
      <button id="applyTextBtn">Apply</button>
      <button id="cancelTextBtn" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
