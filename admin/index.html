<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Fiaz Website Admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <main class="app">
    <section id="login" class="login card">
      <h1>Fiaz Website Admin</h1>
      <p>Edit your website without touching GitHub. Finally. The nerd cupboard is closed.</p>
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" />
      <button id="loginBtn">Login</button>
      <small id="loginMsg"></small>
    </section>

    <section id="editor" class="editor hidden">
      <header class="topbar">
        <div>
          <h1>Website Editor</h1>
          <p id="status">Loaded. Edit, save, done.</p>
        </div>
        <div class="actions">
          <a class="ghost" href="/" target="_blank">View site</a>
          <button id="saveBtn">Save website</button>
        </div>
      </header>

      <nav class="tabs" id="tabs"></nav>
      <form id="form" class="grid"></form>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
