<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Jackal Black Builder</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <h1>Jackal Black Builder</h1>
    <p>Premium layer editor. Move, resize, restyle and publish.</p>
    <input id="password" type="password" placeholder="Admin password"/>
    <button id="loginBtn">Login</button>
    <small id="loginMsg"></small>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div><strong>Jackal Black Builder</strong><span id="status">Ready.</span></div>
    <div class="toolbar">
      <button id="addTextBtn">Add text</button>
      <button id="addButtonBtn">Add button</button>
      <button id="addBoxBtn">Add box</button>
      <button id="layersBtn">Layers</button>
      <button id="inspectorBtn">Inspector</button>
      <button id="undoBtn">Undo</button>
      <button id="redoBtn">Redo</button>
      <button id="publishBtn" class="publish">Publish</button>
    </div>
  </div>

  <div id="layersPanel" class="layers-panel hidden">
    <h2>Layers</h2>
    <div id="layersList"></div>
  </div>

  <div id="inspector" class="inspector hidden">
    <h2>Inspector</h2>
    <p id="inspectorName">Select a layer</p>
    <div class="grid2">
      <label>X<input id="propX" type="number"></label>
      <label>Y<input id="propY" type="number"></label>
      <label>W<input id="propW" type="number"></label>
      <label>H<input id="propH" type="number"></label>
      <label>Z<input id="propZ" type="number"></label>
      <label>Opacity<input id="propOpacity" type="number" min="0" max="1" step=".05"></label>
    </div>
    <label>Text colour<input id="propColor" type="text" placeholder="#ffffff"></label>
    <label>Background<input id="propBg" type="text" placeholder="gradient or #111"></label>
    <label>Border radius<input id="propRadius" type="text" placeholder="20px"></label>
    <button id="applyInspectorBtn" class="full">Apply inspector</button>
  </div>

  <main class="workspace">
    <div id="canvasWrap">
      <div id="canvas"></div>
    </div>
  </main>

  <div id="toolbox" class="toolbox hidden">
    <button id="editTextBtn">Edit</button>
    <button id="biggerBtn">Bigger</button>
    <button id="smallerBtn">Smaller</button>
    <button id="replaceBtn">Replace image</button>
    <button id="frontBtn">Front</button>
    <button id="backBtn">Back</button>
    <button id="lockBtn">Lock</button>
    <button id="hideBtn">Hide</button>
    <button id="duplicateBtn">Duplicate</button>
    <button id="deleteBtn">Delete</button>
    <button id="doneBtn">Done</button>
  </div>

  <input id="imageUpload" type="file" accept="image/*" hidden>
</div>

<div id="textModal" class="modal hidden">
  <div class="modal-card">
    <h2>Edit text</h2>
    <textarea id="textEditor"></textarea>
    <div class="modal-actions">
      <button id="applyTextBtn">Apply</button>
      <button id="cancelTextBtn" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
